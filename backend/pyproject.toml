[project]
name = "zeroday-backend"
version = "0.1.0"
description = "Zeroday backend: PNC data API, Nessie client, Nemotron agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.build-backend]
module-name = "zeroday"

[tool.pytest.ini_options]
testpaths = ["tests"]
